    <h2>CÔ HÁI MƠ</h2>
    <pre style="font-family: 'Times New Roman', Times, serif; font-size: 16px;">
<i>Thơ thẩn đường chiều một khách thơ,</i>
<b><i>Say nhìn xa rặng núi xanh lơ,</i></b>
Khi trời lặng lẽ và trong trẻo,
<u>Thấp thoáng rừng mơ, Cô hái mơ.</u>
<u>Tác giả:</u> <s><i>Vô danh</i></s>
 </pre>
